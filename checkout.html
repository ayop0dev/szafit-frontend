<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SZAFIT Premium Program Checkout">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' https: data:; font-src 'self' data: https:; connect-src 'self' https://api.szafit.com https://z.szafit.com https://images.unsplash.com; frame-src https://z.szafit.com; base-uri 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>الدفع | SZAFIT Elite Coaching</title>
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./styles/tailwind.css">
    <!-- Custom Theme Styles -->
    <link rel="stylesheet" href="./css/style.css">
    
    <style>
        /* Checkout specific styles */
        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        .checkout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .checkout-header a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .checkout-header a:hover {
            color: var(--primary-green, #01D09A);
        }
        
        .checkout-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }
        
        @media (max-width: 768px) {
            .checkout-content {
                grid-template-columns: 1fr;
            }
        }
        
        .checkout-frame {
            background: var(--surface-base);
            border: 1px solid var(--border-subtle);
            border-radius: 0.75rem;
            padding: 1.5rem;
            min-height: 600px;
        }
        
        .checkout-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            min-height: 600px;
        }
        
        .order-summary {
            background: var(--surface-base);
            border: 1px solid var(--border-subtle);
            border-radius: 0.75rem;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 2rem;
        }
        
        .order-summary h3 {
            margin: 0 0 1.5rem;
            color: var(--text-primary);
            font-size: 1.125rem;
            font-weight: 700;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .summary-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .summary-label {
            color: var(--text-secondary, #7E7E7E);
            font-size: 0.875rem;
        }
        
        .summary-value {
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .summary-total {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-green, #01D09A);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid var(--primary-green, #01D09A);
        }
        
        .loading-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 600px;
            gap: 1rem;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-subtle);
            border-top-color: var(--primary-green, #01D09A);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-card {
            background: rgba(211, 47, 47, 0.1);
            border: 1px solid rgba(211, 47, 47, 0.3);
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
        }
        
        .error-card h4 {
            color: #d32f2f;
            margin: 0 0 0.5rem;
        }
        
        .error-card p {
            color: var(--text-primary);
            margin: 0 0 1rem;
            font-size: 0.875rem;
        }
        
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--border-subtle);
            color: var(--text-primary);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.875rem;
            transition: background 0.3s ease;
        }
        
        .btn-back:hover {
            background: var(--shadow-subtle);
        }
    </style>
</head>
<body class="dark">
    <!-- ========================= CHECKOUT: HEADER ========================= -->
    <header class="border-bottom border-subtle sticky top-0 z-40 bg-surface-base">
        <nav class="checkout-container">
            <div class="checkout-header">
                <a href="index.html" class="btn-back">
                    <span>←</span>
                    <span id="backLabel">العودة إلى البرامج</span>
                </a>
                <h1 style="margin: 0; color: var(--text-primary); font-size: 1.5rem; font-weight: 700;" data-i18n="checkout.title">إكمال الدفع</h1>
                <div style="width: 120px;"></div> <!-- Spacer for alignment -->
            </div>
        </nav>
    </header>

    <!-- ========================= CHECKOUT: MAIN SECTION ========================= -->
    <div class="checkout-container">
        <div class="checkout-content">
            <!-- Payment Form -->
            <div class="checkout-frame" id="checkoutFrame">
                <div class="loading-card">
                    <div class="spinner"></div>
                    <p style="color: var(--text-secondary); margin: 0;" data-i18n="checkout.loading">جاري تحميل صفحة الدفع...</p>
                </div>
            </div>

            <!-- Order Summary Sidebar -->
            <aside class="order-summary" id="orderSummary">
                <h3 data-i18n="checkout.summary">ملخص الطلب</h3>
                
                <div class="summary-item">
                    <span class="summary-label" data-i18n="checkout.program">البرنامج</span>
                    <span class="summary-value" id="programName">-</span>
                </div>

                <div class="summary-item">
                    <span class="summary-label" data-i18n="checkout.price">السعر</span>
                    <span class="summary-value" id="programPrice">-</span>
                </div>

                <div class="summary-item">
                    <span class="summary-label" data-i18n="checkout.currency">العملة</span>
                    <span class="summary-value" id="programCurrency">-</span>
                </div>

                <div class="summary-total">
                    <span data-i18n="checkout.total">الإجمالي: </span>
                    <span id="totalPrice">-</span>
                </div>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <!-- i18next Library & Backend (for bilingual support) -->
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/dist/umd/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@2.4.2/dist/umd/i18nextHttpBackend.min.js"></script>
    
    <!-- Core App Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <script src="./scripts/i18n-config.js"></script>
    <script src="./scripts/checkout.js"></script>
</body>
</html>
