    <script>
    (function() {
        const langToggle = document.getElementById('langToggle');
        const themeToggle = document.getElementById('themeToggle');
        const mobileToggle = document.getElementById('mobileToggle');
        const mobileMenu = document.getElementById('mobileMenu');

        // Theme toggle
        function applyTheme(theme) {
            const isDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', isDark);
            if (themeToggle) themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }
        applyTheme(localStorage.getItem('theme') || 'light');
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
                localStorage.setItem('theme', newTheme);
                applyTheme(newTheme);
            });
        }

        // Language toggle
        if (langToggle && typeof toggleLanguage === 'function') {
            langToggle.addEventListener('click', function() {
                const newLang = toggleLanguage();
                if (typeof updateDataI18nElements === 'function') {
                    updateDataI18nElements(newLang);
                }
                document.documentElement.dir = newLang === 'ar' ? 'rtl' : 'ltr';
                if (langToggle) langToggle.textContent = newLang === 'ar' ? 'EN' : 'AR';
            });
        }
        const currentLang = document.documentElement.lang || 'ar';
        if (langToggle) langToggle.textContent = currentLang === 'ar' ? 'EN' : 'AR';

        // Mobile menu
        if (mobileToggle && mobileMenu) {
            mobileToggle.addEventListener('click', function() {
                const isHidden = mobileMenu.classList.toggle('hidden');
                mobileToggle.setAttribute('aria-expanded', !isHidden);
            });
        }
        document.addEventListener('click', function(e) {
            if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                if (!e.target.closest('nav')) {
                    mobileMenu.classList.add('hidden');
                    if (mobileToggle) mobileToggle.setAttribute('aria-expanded', 'false');
                }
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && mobileMenu) {
                mobileMenu.classList.add('hidden');
                if (mobileToggle) mobileToggle.setAttribute('aria-expanded', 'false');
            }
        });
    })();
    </script>
