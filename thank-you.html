    <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/dist/umd/i18next.min.js"></script>

    <script>
    (function() {
        // Parse order_id from URL
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order_id');
        if (orderId) {
            const box = document.getElementById('orderBox');
            const display = document.getElementById('orderIdDisplay');
            if (box && display) {
                display.textContent = orderId;
                box.classList.remove('hidden');
            }
        }

        // Language toggle (reuse i18n-config functions)
        const langToggle = document.getElementById('langToggle');
        if (langToggle && typeof toggleLanguage === 'function') {
            langToggle.addEventListener('click', function() {
                const newLang = toggleLanguage();
                // Re-apply data-i18n attributes on this page
                if (typeof updateDataI18nElements === 'function') {
                    updateDataI18nElements(newLang);
                }
                // Update dir
                document.documentElement.dir = newLang === 'ar' ? 'rtl' : 'ltr';
            });
        }

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            function applyTheme(theme) {
                const isDark = theme === 'dark';
                document.documentElement.classList.toggle('dark', isDark);
                themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            }
            const currentTheme = localStorage.getItem('theme') || 'light';
            applyTheme(currentTheme);
            themeToggle.addEventListener('click', function() {
                const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
                localStorage.setItem('theme', newTheme);
                applyTheme(newTheme);
            });
        }

        // Sync lang button text on load
        const currentLang = document.documentElement.lang || 'ar';
        if (langToggle) {
            langToggle.textContent = currentLang === 'ar' ? 'EN' : 'AR';
        }
    })();
    </script>
